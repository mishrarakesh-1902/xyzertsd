version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DATA_CACHE_DIR=/app/data/cache
    volumes:
      - backend-cache:/app/data/cache
    networks:
      - windscope-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: windscope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - windscope-net

volumes:
  backend-cache:
    name: windscope-backend-cache

networks:
  windscope-net:
    name: windscope-network
    driver: bridge
